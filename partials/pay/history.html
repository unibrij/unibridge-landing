<!-- partials/pay/history.html -->

<section
  id="payHistory"
  class="history-content"
  aria-live="polite"
>
  <div
    id="payHistoryUnavailable"
    class="history-state-card"
    hidden
  >
    <strong>
      History unavailable
    </strong>

    <span>
      This session does not have access to payout history.
    </span>
  </div>

  <div
    id="payHistoryLoading"
    class="history-state-card"
    hidden
  >
    <span>
      Loading history...
    </span>
  </div>

  <div
    id="payHistoryError"
    class="history-state-card"
    role="alert"
    hidden
  >
    <strong>
      Could not load history
    </strong>

    <span id="payHistoryErrorMessage">
      History could not be loaded.
    </span>
  </div>

  <div
    id="payHistoryReceiptError"
    class="history-state-card"
    role="alert"
    hidden
  >
    <span id="payHistoryReceiptErrorMessage">
      Unable to download receipt. Please try again.
    </span>
  </div>

  <div
    id="payHistoryEmpty"
    class="history-state-card"
    hidden
  >
    <strong>
      No payouts yet
    </strong>

    <span>
      Completed payouts will appear here.
    </span>
  </div>

  <section
    id="payHistoryPayouts"
    class="history-section history-payouts-section"
    aria-labelledby="payHistoryPayoutsHeading"
    hidden
  >
    <div class="history-section-header">
      <h2
        id="payHistoryPayoutsHeading"
        class="history-section-title"
      >
        Recent payouts
      </h2>
    </div>

    <div
      id="payHistoryPayoutList"
      class="history-payout-list"
    ></div>
  </section>
</section>
