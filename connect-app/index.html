<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "@id": "https://www.unibrij.io/connect#webapp",
  "name": "UniBridge Connect",
  "url": "https://www.unibrij.io/connect",
  "applicationCategory": "FinanceApplication",
  "operatingSystem": "Web",
  "publisher": {
    "@id": "https://www.unibrij.io/#organization"
  },
  "provider": {
    "@id": "https://www.unibrij.io/#organization"
  },
  "isPartOf": {
    "@id": "https://www.unibrij.io/#organization"
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "https://www.unibrij.io/connect"
  },
  "description": "UniBridge Connect is the non-custodial user-facing entry point of UniBridge for accessing supported payout routes. Connecting a wallet does not give UniBridge access to user funds, seed phrases, private keys, or independent transfer authority. Users approve required blockchain transactions directly from their own wallet.",
  "featureList": [
    "External wallet connection",
    "Supported payout route review",
    "User-authorized transaction signing",
    "Non-custodial payout route initiation",
    "Route status visibility"
  ]
}
    </script>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <title>UniBridge Connect</title>

    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />

    <link rel="apple-touch-icon" href="/connect/icons/app/ub-app-icon-512.png" />

    <meta name="theme-color" content="#ffffff" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="UniBridge" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>

  <body>
    <div id="root"></div>

    <script>
      (function () {
        const CONNECT_CACHE_PREFIX =
          "unibridge-connect-";

        const CLEANUP_RELOAD_KEY =
          "unibridge_connect_sw_cleanup_reloaded_v1";

        async function cleanupConnectServiceWorker() {
          let changed =
            false;

          try {
            if (
              "serviceWorker" in
              navigator
            ) {
              const registrations =
                await navigator
                  .serviceWorker
                  .getRegistrations();

              for (
                const registration
                of registrations
              ) {
                let scopeUrl;

                try {
                  scopeUrl =
                    new URL(
                      registration.scope
                    );
                }
                catch {
                  continue;
                }

                if (
                  scopeUrl.origin !==
                    window.location.origin ||
                  !scopeUrl.pathname.startsWith(
                    "/connect/"
                  )
                ) {
                  continue;
                }

                const unregistered =
                  await registration
                    .unregister();

                if (
                  unregistered
                ) {
                  changed =
                    true;
                }
              }
            }

            if (
              "caches" in
              window
            ) {
              const cacheKeys =
                await caches.keys();

              for (
                const cacheKey
                of cacheKeys
              ) {
                if (
                  !cacheKey.startsWith(
                    CONNECT_CACHE_PREFIX
                  )
                ) {
                  continue;
                }

                const deleted =
                  await caches.delete(
                    cacheKey
                  );

                if (
                  deleted
                ) {
                  changed =
                    true;
                }
              }
            }

            if (!changed) {
              try {
                sessionStorage
                  .removeItem(
                    CLEANUP_RELOAD_KEY
                  );
              }
              catch {
                // Ignore storage restrictions.
              }

              return;
            }

            let alreadyReloaded =
              false;

            try {
              alreadyReloaded =
                sessionStorage
                  .getItem(
                    CLEANUP_RELOAD_KEY
                  ) ===
                "1";
            }
            catch {
              // Ignore storage restrictions.
            }

            if (
              alreadyReloaded
            ) {
              return;
            }

            try {
              sessionStorage
                .setItem(
                  CLEANUP_RELOAD_KEY,
                  "1"
                );
            }
            catch {
              // Ignore storage restrictions.
            }

            window.location.reload();
          }
          catch (
            error
          ) {
            console.warn(
              "CONNECT_SERVICE_WORKER_CLEANUP_FAILED",
              error
            );
          }
        }

        void cleanupConnectServiceWorker();
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
