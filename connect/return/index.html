<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Verification received</title>

  <style>
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }

    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    p {
      color: #475569;
      line-height: 1.6;
    }

    .intent {
      margin-top: 20px;
      padding: 16px;
      border-radius: 16px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      font-family: monospace;
      word-break: break-all;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-top: 24px;
      padding: 14px 18px;
      border-radius: 14px;
      background: #0f172a;
      color: white;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <h1>Verification received</h1>

      <p>
        Your verification was submitted successfully.
        Continue your payout flow to receive funding instructions.
      </p>

      <div id="intent" class="intent"></div>

      <a id="continueBtn" class="btn">
        Continue payout
      </a>
    </div>
  </div>

  <script>
    const params =
      new URLSearchParams(window.location.search);

    const payoutIntentId =
      params.get("payout_intent_id");

    document.getElementById("intent").textContent =
      payoutIntentId || "No payout intent";

    const continueUrl =
      payoutIntentId
        ? `/connect/?payout_intent_id=${encodeURIComponent(payoutIntentId)}`
        : "/connect/";

    document
      .getElementById("continueBtn")
      .setAttribute("href", continueUrl);
  </script>
</body>
</html>
