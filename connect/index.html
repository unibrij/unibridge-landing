<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1020" />

  <title>UniBridge Connect</title>

  <link rel="icon" type="image/png" href="../favicon.png" />
  <link rel="stylesheet" href="./connect.css" />
</head>
<body>

  <main class="connect-shell">
    <img
      src="../public/icons/social/Ub.png"
      class="logo"
      alt="UniBridge"
    />

    <h1>Connect your wallet</h1>

    <p>
      Use your wallet to fund verified payout routes.
    </p>

    <div id="wallet-button"></div>

    <section id="payout-form" class="payout-form hidden">
      <div class="route-label">Brazil PIX route</div>

      <label>
        Amount
        <input id="payout-amount" type="number" min="1" placeholder="100" />
      </label>

      <label>
        Asset
        <select id="payout-asset">
          <option value="USDT">USDT</option>
          <option value="USDC">USDC</option>
        </select>
      </label>

      <label>
        Recipient name
        <input id="recipient-name" type="text" placeholder="Recipient name" />
      </label>

      <label>
        PIX key
        <input id="recipient-pix" type="text" placeholder="email, CPF, phone, or random key" />
      </label>

      <button id="create-payout-intent" type="button">
        Create payout intent
      </button>

      <pre id="connect-debug" class="connect-debug"></pre>
    </section>
  </main>

  <script type="module" src="./reown.js"></script>
  <script type="module" src="./connect.js"></script>

</body>
</html>
