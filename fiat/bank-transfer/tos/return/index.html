<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>UniBridge — Terms Accepted</title>

  <link rel="icon" type="image/png" href="/favicon.png" />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f7f9fb;
      color: #18212f;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: calc(100% - 40px);
      max-width: 520px;
      background: #ffffff;
      border: 1px solid #e6edf3;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 18px 60px rgba(24, 33, 47, 0.08);
      text-align: center;
    }

    .logo {
      width: 68px;
      height: 68px;
      object-fit: contain;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 26px;
      line-height: 1.25;
    }

    p {
      margin: 0;
      color: #5d6b7c;
      font-size: 15px;
      line-height: 1.6;
    }

    .status {
      margin-top: 20px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #f1f5f9;
      font-size: 13px;
      color: #334155;
      word-break: break-word;
    }

    .success {
      background: #ecfdf5;
      color: #047857;
    }

    .failed {
      background: #fef2f2;
      color: #b91c1c;
    }
  </style>
</head>

<body>
  <main class="card">
    <img class="logo" src="/unibrij-logo.png" alt="UniBridge" />

    <h1 id="title">Confirming terms acceptance…</h1>

    <p id="message">
      Please keep this page open while UniBridge records your Bridge terms acceptance.
    </p>

    <div id="status" class="status">
      Processing…
    </div>
  </main>

  <script>
    const BACKEND_BASE =
      "https://unibridge-v2-1066944028362.us-central1.run.app";

    const titleEl =
      document.getElementById("title");

    const messageEl =
      document.getElementById("message");

    const statusEl =
      document.getElementById("status");

    function setStatus({
      title,
      message,
      status,
      kind
    }) {
      titleEl.textContent = title;
      messageEl.textContent = message;
      statusEl.textContent = status;

      statusEl.className =
        "status" + (kind ? " " + kind : "");
    }

    function buildNextUrl(settlementId) {
      return (
        "/fiat/bank-transfer?settlement_id=" +
        encodeURIComponent(settlementId) +
        "&tos_accepted=1"
      );
    }

    function redirectToBankTransferFlow(settlementId) {
      const nextUrl =
        buildNextUrl(settlementId);

      window.setTimeout(() => {
        window.location.href =
          nextUrl;
      }, 1200);
    }

    async function confirmBridgeTosReturn() {
      try {
        const params =
          new URLSearchParams(window.location.search);

        const settlementId =
          params.get("settlement_id");

        const signedAgreementId =
          params.get("signed_agreement_id") ||
          params.get("signedAgreementId");

        if (!settlementId) {
          throw new Error("missing_settlement_id");
        }

        if (!signedAgreementId) {
          throw new Error("missing_signed_agreement_id");
        }

        const url =
          BACKEND_BASE +
          "/v2/fiat/bridge-tos/return" +
          "?settlement_id=" +
          encodeURIComponent(settlementId) +
          "&signed_agreement_id=" +
          encodeURIComponent(signedAgreementId);

        const response =
          await fetch(url, {
            method: "GET",
            headers: {
              Accept: "application/json"
            }
          });

        const body =
          await response.json().catch(() => ({}));

        if (!response.ok || !body.ok) {
          throw new Error(
            body.error || "bridge_tos_return_failed"
          );
        }

        setStatus({
          title: "Terms accepted",
          message:
            "Your Bridge terms acceptance was recorded. Continuing bank transfer setup…",
          status:
            "Settlement: " + settlementId,
          kind:
            "success"
        });

        redirectToBankTransferFlow(
          settlementId
        );
      } catch (err) {
        setStatus({
          title: "Could not confirm terms",
          message:
            "UniBridge could not record the Bridge terms acceptance.",
          status:
            err.message || "bridge_tos_return_failed",
          kind:
            "failed"
        });
      }
    }

    confirmBridgeTosReturn();
  </script>
</body>
</html>
