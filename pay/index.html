<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
  />

  <title>Pay with UniBridge</title>

  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/connect/icons/app/ub-app-icon-512.png" />

  <meta name="theme-color" content="#000E2D" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="UniBridge" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="preload" as="image" href="/public/icons/social/connect-map-bg.png" />
  <link rel="stylesheet" href="/pay/styles.css?v=19" />
</head>

<body>
  <main class="page">
    <section class="hero">
      <img
        class="brand-logo"
        src="/connect/icons/social/Ub.png"
        alt="UniBridge"
      />

      <p class="eyebrow">Pay with UniBridge</p>

      <h1>Choose how you want to fund your payout</h1>

      <p class="subtitle">
        Start with a wallet, bank transfer, or card payment.
      </p>
    </section>

    <section id="choiceCard" class="card">
      <button
        id="walletOption"
        class="choice-card"
        type="button"
      >
        <span class="choice-icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            class="choice-svg wallet-svg"
          >
            <path
              d="M5.2 7.75H17.9C19.05 7.75 20 8.7 20 9.85V17.2C20 18.3 19.1 19.2 18 19.2H6.35C4.75 19.2 3.45 17.9 3.45 16.3V8.95C3.45 8.3 3.95 7.75 5.2 7.75Z"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

            <path
              d="M5.55 7.75 15.65 4.95C16.75 4.65 17.85 5.45 17.85 6.6V7.75"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

            <path
              d="M16.1 11.15H20V15.25H16.1C14.95 15.25 14.05 14.35 14.05 13.2C14.05 12.05 14.95 11.15 16.1 11.15Z"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

            <circle
              cx="16.35"
              cy="13.2"
              r="0.55"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
            />
          </svg>
        </span>

        <span>
          <strong>Pay with wallet</strong>
          <small>
            Connect your wallet and fund the payout route directly.
          </small>
        </span>
      </button>

      <button
        id="fiatOption"
        class="choice-card"
        type="button"
      >
        <span class="choice-icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            class="choice-svg bank-svg"
          >
            <path
              d="M4.4 9.35 12 5.15 19.6 9.35"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

            <path
              d="M5.65 10.45H18.35"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
            />

            <rect
              x="6.65"
              y="12.05"
              width="2.05"
              height="5.75"
              rx="0.35"
              fill="none"
              stroke="currentColor"
            />

            <rect
              x="10.98"
              y="12.05"
              width="2.05"
              height="5.75"
              rx="0.35"
              fill="none"
              stroke="currentColor"
            />

            <rect
              x="15.3"
              y="12.05"
              width="2.05"
              height="5.75"
              rx="0.35"
              fill="none"
              stroke="currentColor"
            />

            <path
              d="M6 18.85H18"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
            />

            <path
              d="M4.9 20.65H19.1"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
            />

            <circle
              cx="12"
              cy="7.65"
              r="0.55"
              fill="currentColor"
            />
          </svg>
        </span>

        <span>
          <strong>Pay with fiat</strong>
          <small>
            Continue with bank transfer or card payment.
          </small>
        </span>
      </button>
    </section>

    <section
      id="guideCard"
      class="card guide-card hidden"
      aria-labelledby="guideTitle"
    >
      <div class="guide-card-header">
        <span class="guide-icon">✦</span>
        <span class="guide-badge">Guide</span>
      </div>

      <h2 id="guideTitle">UniBridge Guide</h2>

      <p>
        Not sure which funding option fits your route? Learn about wallet,
        fiat funding, payout routes, and safety.
      </p>

      <button
        id="guideCardAction"
        class="guide-action"
        type="button"
      >
        Open UniBridge Guide →
      </button>
    </section>

    <section id="fiatCard" class="card hidden">
      <form id="fiatForm">
        <div class="form-grid">
          <label class="field">
            <span>Source country</span>

            <select id="sourceCountry" required>
              <option value="US">United States</option>
              <option value="EU">Europe / SEPA</option>
              <option value="GB">United Kingdom</option>
              <option value="AE">United Arab Emirates</option>
            </select>
          </label>

          <label class="field">
            <span>Destination country</span>

            <select id="receiverCountry" required>
              <option value="BR">Brazil</option>
              <option value="PH">Philippines</option>
            </select>
          </label>

          <label class="field">
            <span>Amount</span>

            <input
              id="amount"
              type="number"
              min="1"
              step="0.01"
              value="5"
              required
            />
          </label>
        </div>

        <section class="method-grid">
          <label class="method-card">
            <input
              type="radio"
              name="paymentMethod"
              value="bank_transfer"
              checked
            />

            <span>
              <strong>Bank transfer</strong>
              <small>
                ACH, SEPA, or Faster Payments funding.
              </small>
            </span>
          </label>

          <label class="method-card">
            <input
              type="radio"
              name="paymentMethod"
              value="ramp"
            />

            <span>
              <strong>Card payment</strong>
              <small>
                Use a supported card or ramp provider to fund the payout.
              </small>
            </span>
          </label>
        </section>

        <div class="actions">
          <button
            id="backAction"
            class="button secondary"
            type="button"
          >
            Back
          </button>

          <button
            class="button primary"
            type="submit"
          >
            Continue
          </button>
        </div>
      </form>
    </section>

    <footer class="pay-footer">
      <span>© 2026 UniBridge Technologies</span>

      <nav class="pay-footer-links" aria-label="Footer links">
        <a href="/privacy">Privacy</a>
        <span aria-hidden="true">|</span>
        <a href="/terms">Terms</a>
      </nav>
    </footer>
  </main>

  <script
    type="module"
    src="/pay/js/pay.js?v=4"
  ></script>
</body>
</html>
