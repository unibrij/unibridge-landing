<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
  />

  <title>Pay with UniBridge</title>

  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/connect/icons/app/ub-app-icon-512.png" />

  <meta name="theme-color" content="#000E2D" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="UniBridge" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="preload" as="image" href="/public/icons/social/connect-map-bg.png" />
  <link rel="stylesheet" href="/pay/styles.css?v=14" />
</head>

<body>
  <main class="page">
    <section class="hero">
      <img
        class="brand-logo"
        src="/connect/icons/social/Ub.png"
        alt="UniBridge"
      />

      <p class="eyebrow">Pay with UniBridge</p>

      <h1>Choose how you want to fund your payout</h1>

      <p class="subtitle">
        Start with a wallet, bank transfer, or card payment.
      </p>
    </section>

    <section id="choiceCard" class="card">
      <button
        id="walletOption"
        class="choice-card"
        type="button"
      >
        <span class="choice-icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            class="choice-svg wallet-svg"
          >
            <path
              d="M19 7V6.4C19 5.63 18.37 5 17.6 5H6.8C5.25 5 4 6.25 4 7.8V16.2C4 17.75 5.25 19 6.8 19H19.4C19.73 19 20 18.73 20 18.4V15"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M4 8H18.2C19.2 8 20 8.8 20 9.8V10"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M16.4 11H20V15H16.4C15.3 15 14.4 14.1 14.4 13C14.4 11.9 15.3 11 16.4 11Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <circle
              cx="16.7"
              cy="13"
              r="0.55"
              fill="currentColor"
            />
          </svg>
        </span>

        <span>
          <strong>Pay with wallet</strong>
          <small>
            Connect your wallet and fund the payout route directly.
          </small>
        </span>
      </button>

      <button
        id="fiatOption"
        class="choice-card"
        type="button"
      >
        <span class="choice-icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            class="choice-svg bank-svg"
          >
            <path
              d="M3.75 21H20.25"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
            />
            <path
              d="M5 9.5H19"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
            />
            <path
              d="M6.25 18V9.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
            />
            <path
              d="M10.1 18V9.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
            />
            <path
              d="M13.9 18V9.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
            />
            <path
              d="M17.75 18V9.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
            />
            <path
              d="M4.5 7.2L12 3.25L19.5 7.2"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M5.75 18H18.25"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
            />
          </svg>
        </span>

        <span>
          <strong>Pay with fiat</strong>
          <small>
            Continue with bank transfer or card payment.
          </small>
        </span>
      </button>
    </section>

    <section
      id="guideCard"
      class="card guide-card hidden"
      aria-labelledby="guideTitle"
    >
      <div class="guide-card-header">
        <span class="guide-icon">✦</span>
        <span class="guide-badge">Guide</span>
      </div>

      <h2 id="guideTitle">UniBridge Guide</h2>

      <p>
        Not sure which funding option fits your route? Learn about wallet,
        fiat funding, payout routes, and safety.
      </p>

      <button
        id="guideCardAction"
        class="guide-action"
        type="button"
      >
        Open UniBridge Guide →
      </button>
    </section>

    <section id="fiatCard" class="card hidden">
      <form id="fiatForm">
        <div class="form-grid">
          <label class="field">
            <span>Source country</span>

            <select id="sourceCountry" required>
              <option value="US">United States</option>
              <option value="EU">Europe / SEPA</option>
              <option value="GB">United Kingdom</option>
              <option value="AE">United Arab Emirates</option>
            </select>
          </label>

          <label class="field">
            <span>Destination country</span>

            <select id="receiverCountry" required>
              <option value="BR">Brazil</option>
              <option value="PH">Philippines</option>
            </select>
          </label>

          <label class="field">
            <span>Amount</span>

            <input
              id="amount"
              type="number"
              min="1"
              step="0.01"
              value="5"
              required
            />
          </label>
        </div>

        <section class="method-grid">
          <label class="method-card">
            <input
              type="radio"
              name="paymentMethod"
              value="bank_transfer"
              checked
            />

            <span>
              <strong>Bank transfer</strong>
              <small>
                ACH, SEPA, or Faster Payments funding.
              </small>
            </span>
          </label>

          <label class="method-card">
            <input
              type="radio"
              name="paymentMethod"
              value="ramp"
            />

            <span>
              <strong>Card payment</strong>
              <small>
                Use a supported card or ramp provider to fund the payout.
              </small>
            </span>
          </label>
        </section>

        <div class="actions">
          <button
            id="backAction"
            class="button secondary"
            type="button"
          >
            Back
          </button>

          <button
            class="button primary"
            type="submit"
          >
            Continue
          </button>
        </div>
      </form>
    </section>
  </main>

  <script
    type="module"
    src="/pay/js/pay.js?v=4"
  ></script>
</body>
</html>
