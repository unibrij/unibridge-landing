<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
  />

  <title>Send or Receive with UniBridge</title>

  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/connect/icons/app/ub-app-icon-512.png" />

  <meta name="theme-color" content="#000E2D" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="UniBridge" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <meta
    name="description"
    content="Choose whether to send or receive with UniBridge."
  />

  <link
    rel="preload"
    as="image"
    href="/public/icons/social/connect-map-bg.png"
  />

  <link
    rel="preload"
    as="image"
    href="/public/icons/social/unibridge-orbit-lockup-white.png"
  />

  <link
    rel="stylesheet"
    href="/partials/pay/css/pay-common.css?v=1"
  />

  <link
    rel="stylesheet"
    href="/pay/css/pay-entry.css?v=1"
  />
</head>

<body>
  <main class="page pay-page-shell">
    <div id="pay-brand"></div>

    <section class="hero">
      <h1 class="sr-only">
        Send or Receive with UniBridge
      </h1>

      <p class="eyebrow">
        Send or Receive
      </p>
    </section>

    <section
      class="pay-entry"
      aria-label="Choose an action"
    >
      <button
        id="sendOption"
        class="entry-card entry-card-send"
        type="button"
      >
        <span
          class="entry-icon entry-icon-send"
          aria-hidden="true"
        >
          <svg
            viewBox="0 0 64 64"
            class="entry-svg entry-send-svg"
          >
            <path
              d="M55 10 9 27.2c-2.1.8-2 3.8.2 4.5l17 5.7L32 54c.7 2.1 3.7 2.2 4.5.1L56.8 13c1-2-.1-3.8-1.8-3Z"
              fill="#E8FFFC"
            />

            <path
              d="M26.2 37.4 56 11.2 32 43.8 32 54Z"
              fill="#B9F4EE"
            />

            <path
              d="M26.2 37.4 32 43.8 56 11.2Z"
              fill="#7DDBD5"
            />

            <path
              d="M9.2 29.5 26.2 37.4 56 11.2Z"
              fill="#F5FFFE"
            />
          </svg>
        </span>

        <span class="entry-copy">
          <strong>Send</strong>
          <small>
            Pay someone<br />
            with UniBridge
          </small>
        </span>

        <span
          class="entry-chevron"
          aria-hidden="true"
        >
          ›
        </span>
      </button>

      <button
        id="receiveOption"
        class="entry-card entry-card-receive"
        type="button"
      >
        <span
          class="entry-icon entry-icon-receive"
          aria-hidden="true"
        >
          <svg
            viewBox="0 0 24 24"
            class="entry-svg entry-receive-svg"
          >
            <path
              d="M12 4.5v14"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
            />

            <path
              d="m6.7 13.2 5.3 5.3 5.3-5.3"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>

        <span class="entry-copy">
          <strong>Receive</strong>
          <small>
            Get paid by creating<br />
            a receive link
          </small>
        </span>

        <span
          class="entry-chevron"
          aria-hidden="true"
        >
          ›
        </span>
      </button>
    </section>

    <div id="pay-footer"></div>
  </main>

  <script src="/partials/pay/js/pay-includes.js?v=6"></script>

  <script
    type="module"
    src="/pay/js/pay-entry.js?v=1"
  ></script>
</body>
</html>
