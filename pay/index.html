<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
  />

  <title>Pay with UniBridge</title>

  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/connect/icons/app/ub-app-icon-512.png" />

  <meta name="theme-color" content="#000E2D" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="UniBridge" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="preload" as="image" href="/public/icons/social/connect-map-bg.png" />
  <link rel="stylesheet" href="/pay/styles.css?v=13" />
</head>

<body>
  <main class="page">
    <section class="hero">
      <img
        class="brand-logo"
        src="/connect/icons/social/Ub.png"
        alt="UniBridge"
      />

      <p class="eyebrow">Pay with UniBridge</p>

      <h1>Choose how you want to fund your payout</h1>

      <p class="subtitle">
        Start with a wallet, bank transfer, or card payment.
      </p>
    </section>

    <section id="choiceCard" class="card">
      <button
        id="walletOption"
        class="choice-card"
        type="button"
      >
        <span class="choice-icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            class="choice-svg wallet-svg"
          >
            <path
              d="M4 7.4A3.4 3.4 0 0 1 7.4 4H18a2 2 0 0 1 2 2v2"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M4 7.4v9.2A3.4 3.4 0 0 0 7.4 20H20a1 1 0 0 0 1-1v-3.5"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M16.5 10H21v5h-4.5a2.5 2.5 0 0 1 0-5Z"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M7 4h11"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
            <circle
              cx="16.55"
              cy="12.5"
              r="0.65"
              fill="currentColor"
            />
          </svg>
        </span>

        <span>
          <strong>Pay with wallet</strong>
          <small>
            Connect your wallet and fund the payout route directly.
          </small>
        </span>
      </button>

      <button
        id="fiatOption"
        class="choice-card"
        type="button"
      >
        <span class="choice-icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            class="choice-svg bank-svg"
          >
            <path
              d="M4 9.25 12 4.75l8 4.5"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M5.5 10.5h13"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
            <circle
              cx="12"
              cy="7.65"
              r="0.65"
              fill="currentColor"
            />
            <path
              d="M7.2 12.2v5.8"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
            <path
              d="M12 12.2v5.8"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
            <path
              d="M16.8 12.2v5.8"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
            <path
              d="M6 19.25h12"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
            <path
              d="M4.75 21h14.5"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </span>

        <span>
          <strong>Pay with fiat</strong>
          <small>
            Continue with bank transfer or card payment.
          </small>
        </span>
      </button>
    </section>

    <section
      id="guideCard"
      class="card guide-card hidden"
      aria-labelledby="guideTitle"
    >
      <div class="guide-card-header">
        <span class="guide-icon">✦</span>
        <span class="guide-badge">Guide</span>
      </div>

      <h2 id="guideTitle">UniBridge Guide</h2>

      <p>
        Not sure which funding option fits your route? Learn about wallet,
        fiat funding, payout routes, and safety.
      </p>

      <button
        id="guideCardAction"
        class="guide-action"
        type="button"
      >
        Open UniBridge Guide →
      </button>
    </section>

    <section id="fiatCard" class="card hidden">
      <form id="fiatForm">
        <div class="form-grid">
          <label class="field">
            <span>Source country</span>

            <select id="sourceCountry" required>
              <option value="US">United States</option>
              <option value="EU">Europe / SEPA</option>
              <option value="GB">United Kingdom</option>
              <option value="AE">United Arab Emirates</option>
            </select>
          </label>

          <label class="field">
            <span>Destination country</span>

            <select id="receiverCountry" required>
              <option value="BR">Brazil</option>
              <option value="PH">Philippines</option>
            </select>
          </label>

          <label class="field">
            <span>Amount</span>

            <input
              id="amount"
              type="number"
              min="1"
              step="0.01"
              value="5"
              required
            />
          </label>
        </div>

        <section class="method-grid">
          <label class="method-card">
            <input
              type="radio"
              name="paymentMethod"
              value="bank_transfer"
              checked
            />

            <span>
              <strong>Bank transfer</strong>
              <small>
                ACH, SEPA, or Faster Payments funding.
              </small>
            </span>
          </label>

          <label class="method-card">
            <input
              type="radio"
              name="paymentMethod"
              value="ramp"
            />

            <span>
              <strong>Card payment</strong>
              <small>
                Use a supported card or ramp provider to fund the payout.
              </small>
            </span>
          </label>
        </section>

        <div class="actions">
          <button
            id="backAction"
            class="button secondary"
            type="button"
          >
            Back
          </button>

          <button
            class="button primary"
            type="submit"
          >
            Continue
          </button>
        </div>
      </form>
    </section>
  </main>

  <script
    type="module"
    src="/pay/js/pay.js?v=4"
  ></script>
</body>
</html>
