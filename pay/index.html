<body>
  <main class="page">
    <div id="pay-brand"></div>

    <section class="hero" aria-labelledby="payTitle">
      <h1 id="payTitle" class="sr-only">Pay with UniBridge</h1>

      <p class="eyebrow" aria-hidden="true">
        Pay with UniBridge
      </p>
    </section>

    <section id="choiceCard" class="card">
      <button
        id="walletOption"
        class="choice-card"
        type="button"
      >
        <span class="choice-icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            class="choice-svg wallet-svg"
          >
            <path
              d="M5.2 7.75H17.9C19.05 7.75 20 8.7 20 9.85V17.2C20 18.3 19.1 19.2 18 19.2H6.35C4.75 19.2 3.45 17.9 3.45 16.3V8.95C3.45 8.3 3.95 7.75 5.2 7.75Z"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

            <path
              d="M5.55 7.75 15.65 4.95C16.75 4.65 17.85 5.45 17.85 6.6V7.75"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

            <path
              d="M16.1 11.15H20V15.25H16.1C14.95 15.25 14.05 14.35 14.05 13.2C14.05 12.05 14.95 11.15 16.1 11.15Z"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

            <circle
              cx="16.35"
              cy="13.2"
              r="0.55"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
            />
          </svg>
        </span>

        <span>
          <strong>Pay with wallet</strong>
          <small>
            Connect your wallet to review and approve the payment.
          </small>
        </span>
      </button>

      <button
        id="fiatOption"
        class="choice-card"
        type="button"
      >
        <span class="choice-icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            class="choice-svg bank-svg"
          >
            <path
              d="M4.4 9.35 12 5.15 19.6 9.35"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

            <path
              d="M5.65 10.45H18.35"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
            />

            <rect
              x="6.65"
              y="12.05"
              width="2.05"
              height="5.75"
              rx="0.35"
              fill="none"
              stroke="currentColor"
            />

            <rect
              x="10.98"
              y="12.05"
              width="2.05"
              height="5.75"
              rx="0.35"
              fill="none"
              stroke="currentColor"
            />

            <rect
              x="15.3"
              y="12.05"
              width="2.05"
              height="5.75"
              rx="0.35"
              fill="none"
              stroke="currentColor"
            />

            <path
              d="M6 18.85H18"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
            />

            <path
              d="M4.9 20.65H19.1"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
            />

            <circle
              cx="12"
              cy="7.65"
              r="0.55"
              fill="currentColor"
            />
          </svg>
        </span>

        <span>
          <strong>Pay with fiat</strong>
          <small>
            Continue with bank transfer or card payment.
          </small>
        </span>
      </button>
    </section>

    <section
      id="guideCard"
      class="card guide-card hidden"
      aria-labelledby="guideTitle"
    >
      <div class="guide-card-header">
        <span class="guide-icon" aria-hidden="true">✦</span>
        <span class="guide-badge">Guide</span>
      </div>

      <h2 id="guideTitle">UniBridge Guide</h2>

      <p>
        Have a question about UniBridge?
      </p>

      <button
        id="guideCardAction"
        class="guide-action"
        type="button"
      >
        Open UniBridge Guide →
      </button>
    </section>

    <section id="fiatCard" class="card hidden">
      <form id="fiatForm">
        <div class="form-grid">
          <label class="field">
            <span>Source country</span>

            <select
              id="sourceCountry"
              data-country-select="source"
              required
            ></select>
          </label>

          <label class="field">
            <span>Destination country</span>

            <select
              id="receiverCountry"
              data-country-select="destination"
              required
            ></select>
          </label>

          <label class="field amount-field">
            <span>You pay</span>

            <div class="amount-input-wrap">
              <input
                id="amount"
                type="number"
                min="1"
                step="0.01"
                value="5"
                required
                aria-label="Amount"
              />

              <span
                id="amountCurrency"
                class="amount-currency"
                aria-hidden="true"
              >
                USD
              </span>
            </div>

            <small class="field-hint">
              Fees and final amount are shown before confirmation.
            </small>
          </label>
        </div>

        <section class="method-grid">
          <label class="method-card">
            <input
              type="radio"
              name="paymentMethod"
              value="bank_transfer"
              checked
            />

            <span>
              <strong>Bank transfer</strong>
              <small>
                ACH, SEPA, or Faster Payments funding.
              </small>
            </span>
          </label>

          <label class="method-card">
            <input
              type="radio"
              name="paymentMethod"
              value="ramp"
            />

            <span>
              <strong>Card payment</strong>
              <small>
                Pay with Visa or Mastercard through a payment partner.
              </small>
            </span>
          </label>
        </section>

        <div class="actions">
          <button
            id="backAction"
            class="button secondary"
            type="button"
          >
            Back
          </button>

          <button
            class="button primary"
            type="submit"
          >
            Continue
          </button>
        </div>
      </form>
    </section>

    <div id="pay-footer"></div>
  </main>

  <script src="/partials/pay/js/pay-includes.js?v=6"></script>
  <script src="/partials/pay/js/pay-countries.js?v=3"></script>

  <script
    type="module"
    src="/pay/js/pay.js?v=5"
  ></script>
</body>
</html>
