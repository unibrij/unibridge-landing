<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>Pay with UniBridge</title>

  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <main class="page">
    <section class="hero">
      <img class="brand-logo" src="/unibrij-logo.png" alt="UniBridge" />
      <p class="eyebrow">Pay with UniBridge</p>
      <h1>Choose how you want to fund your payout</h1>
      <p class="subtitle">Start with a wallet or continue with fiat funding.</p>
    </section>

    <section id="choiceCard" class="card">
      <button id="walletOption" class="choice-card" type="button">
        <span class="choice-icon">◆</span>
        <span>
          <strong>Pay with wallet</strong>
          <small>Connect your wallet and fund the payout route directly.</small>
        </span>
      </button>

      <button id="fiatOption" class="choice-card" type="button">
        <span class="choice-icon">●</span>
        <span>
          <strong>Pay with fiat</strong>
          <small>Use bank transfer or supported local payment methods.</small>
        </span>
      </button>
    </section>

    <section id="fiatCard" class="card hidden">
      <form id="fiatForm">
        <div class="form-grid">
          <label class="field">
            <span>Source country</span>
            <select id="sourceCountry" required>
              <option value="US">United States</option>
              <option value="EU">Europe / SEPA</option>
              <option value="GB">United Kingdom</option>
            </select>
          </label>

          <label class="field">
            <span>Destination country</span>
            <select id="receiverCountry" required>
              <option value="BR">Brazil</option>
              <option value="PH">Philippines</option>
            </select>
          </label>

          <label class="field">
            <span>Amount</span>
            <input id="amount" type="number" min="1" step="0.01" value="5" required />
          </label>
        </div>

        <section class="method-grid">
          <label class="method-card">
            <input type="radio" name="paymentMethod" value="bank_transfer" checked />
            <span>
              <strong>Bank transfer</strong>
              <small>ACH, SEPA, or Faster Payments funding.</small>
            </span>
          </label>

          <label class="method-card">
            <input type="radio" name="paymentMethod" value="ramp" />
            <span>
              <strong>Card / local payment</strong>
              <small>Use a supported ramp or local payment flow.</small>
            </span>
          </label>
        </section>

        <div class="actions">
          <button id="backAction" class="button secondary" type="button">Back</button>
          <button class="button primary" type="submit">Continue</button>
        </div>
      </form>
    </section>
  </main>

  <script type="module" src="./js/pay.js"></script>
</body>
</html>
