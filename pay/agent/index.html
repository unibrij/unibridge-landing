<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Pay Agent | UniBridge</title>

    <meta
      name="description"
      content="Use the UniBridge Pay Agent to prepare a payout route and continue with wallet funding."
    />

    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />

    <link
      rel="apple-touch-icon"
      href="/connect/icons/app/ub-app-icon-512.png"
    />

    <meta
      name="theme-color"
      content="#000E2D"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="UniBridge"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <link
      rel="preload"
      as="image"
      href="/public/icons/social/connect-map-bg.png"
    />

    <link
      rel="preload"
      as="image"
      href="/public/icons/social/unibridge-orbit-lockup-white.png"
    />

    <link
      rel="stylesheet"
      href="/partials/pay/css/pay-common.css?v=9"
    />

    <link
      rel="stylesheet"
      href="/pay/agent/pay-agent.css"
    />
  </head>

  <body>
    <main class="pay-agent-page">
      <div class="pay-agent-bg" aria-hidden="true"></div>

      <div id="pay-brand"></div>

      <section
        class="pay-agent-layout"
        aria-label="Pay Agent route preparation"
      >
        <aside class="pay-agent-info-card">
          <div class="pay-agent-info-icon" aria-hidden="true">
            ✦
          </div>

          <div class="pay-agent-info-copy">
            <p class="pay-agent-info-kicker">
              Guided route
            </p>
          </div>

          <ol class="pay-agent-steps">
            <li>
              <span>1</span>
              <p>Describe the payment</p>
            </li>

            <li>
              <span>2</span>
              <p>Add recipient details</p>
            </li>

            <li>
              <span>3</span>
              <p>Choose wallet funding</p>
            </li>

            <li>
              <span>4</span>
              <p>Continue to checkout</p>
            </li>
          </ol>

          <p class="pay-agent-trust-note">
            UniBridge prepares the route but does not custody customer funds.
          </p>

          <a
            class="pay-agent-nav-link"
            href="/pay/start/"
          >
            Back to start
          </a>
        </aside>

        <section
          class="pay-agent-chat"
          data-pay-agent-chat
          aria-label="Pay Agent chat"
        >
          <div class="pay-agent-chat-card">
            <div class="pay-agent-chat-header">
              <div class="pay-agent-chat-title-row">
                <div class="pay-agent-chat-icon" aria-hidden="true">
                  ✦
                </div>

                <div>
                  <p class="pay-agent-chat-kicker">
                    Pay with UniBridge
                  </p>

                </div>
              </div>

              <button
                type="button"
                class="pay-agent-reset"
                data-pay-agent-reset
              >
                Reset
              </button>
            </div>

            <div class="pay-agent-status-row">
              <span class="pay-agent-status-label">
                Status
              </span>

              <span
                class="pay-agent-status"
                data-pay-agent-status
              >
                ready
              </span>
            </div>

            <div
              class="pay-agent-messages"
              data-pay-agent-messages
              aria-live="polite"
            ></div>

            <div
              class="pay-agent-actions"
              data-pay-agent-actions
            ></div>

            <form
              class="pay-agent-form"
              data-pay-agent-form
            >
              <input
                class="pay-agent-input"
                data-pay-agent-input
                type="text"
                autocomplete="off"
                placeholder="Describe the payment"
                aria-label="Pay Agent message"
              />

              <button
                class="pay-agent-send"
                data-pay-agent-send
                type="submit"
              >
                Send
              </button>
            </form>
          </div>
        </section>
      </section>

      <div id="pay-footer"></div>
    </main>

    <script src="/partials/pay/js/pay-includes.js?v=6"></script>
    <script src="/pay/js/pay-agent-api.js"></script>
    <script src="/pay/js/pay-agent-storage.js"></script>
    <script src="/pay/js/pay-agent-chat.js"></script>
  </body>
</html>
