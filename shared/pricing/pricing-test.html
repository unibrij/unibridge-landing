<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>Shared Pricing Test</title>

  <link
    rel="stylesheet"
    href="./pricing.css"
  />

  <style>
    body {
      margin: 0;
      padding: 32px;
      font-family:
        Inter,
        system-ui,
        sans-serif;
      background: #f6f8fb;
      color: #10233f;
    }

    .test-page {
      max-width: 680px;
      margin: 0 auto;
    }

    .test-title {
      margin: 0 0 8px;
    }

    .test-description {
      margin: 0 0 24px;
      color: #617086;
    }

    .test-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }

    .test-button {
      border: 1px solid #d9e0ea;
      border-radius: 8px;
      padding: 10px 14px;
      background: #ffffff;
      cursor: pointer;
      font: inherit;
    }

    .test-button:hover {
      background: #edf2f7;
    }

    #pricing-container {
      margin-top: 16px;
    }

    .test-output {
      margin-top: 24px;
      padding: 16px;
      border-radius: 10px;
      background: #10233f;
      color: #ffffff;
      overflow: auto;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="test-page">
    <h1 class="test-title">
      Shared Pricing Test
    </h1>

    <p class="test-description">
      Manual browser test for the shared pricing model and renderer.
    </p>

    <div class="test-controls">
      <button
        class="test-button"
        data-test="canonical"
      >
        Canonical quote
      </button>

      <button
        class="test-button"
        data-test="legacy"
      >
        Legacy route
      </button>

      <button
        class="test-button"
        data-test="indicative"
      >
        Indicative amount
      </button>

      <button
        class="test-button"
        data-test="unavailable"
      >
        Unavailable amount
      </button>

      <button
        class="test-button"
        data-test="empty-fees"
      >
        Canonical empty fees
      </button>

      <button
        class="test-button"
        data-test="clear"
      >
        Clear
      </button>
    </div>

    <div
      id="pricing-container"
      hidden
    ></div>

    <pre
      id="view-model-output"
      class="test-output"
    ></pre>
  </main>

  <script type="module">
    import {
      clearPricing,
      createPricingViewModel,
      renderPricing
    } from "./index.js";

    const container =
      document.querySelector(
        "#pricing-container"
      );

    const output =
      document.querySelector(
        "#view-model-output"
      );

    const scenarios = {
      canonical: {
        quote: {
          requested_amount:
            "100"
        },

        route: {
          label:
            "Brazil PIX",

          pricing_result: {
            quote: {
              requested: {
                amount:
                  "100",

                currency:
                  "USDC",

                semantics:
                  "funding_amount"
              },

              settlement: {
                amount:
                  "100",

                currency:
                  "USDC"
              },

              recipient: {
                amount:
                  "540.25",

                currency:
                  "BRL",

                type:
                  "locked"
              },

              fx_rate:
                "5.4025",

              fees: [
                {
                  type:
                    "provider",

                  amount:
                    "2",

                  currency:
                    "BRL"
                },

                {
                  type:
                    "unibridge",

                  amount:
                    "1",

                  currency:
                    "USDC"
                },

                {
                  type:
                    "partner",

                  amount:
                    "0.5",

                  currency:
                    "USDC"
                }
              ]
            }
          }
        },

        sourceLabel:
          "USDC on Polygon"
      },

      legacy: {
        route: {
          label:
            "Philippines InstaPay",

          funding_amount:
            "100",

          settlement_currency:
            "USDC",

          payout_amount:
            "5800",

          recipient_currency:
            "PHP",

          recipient_amount_type:
            "final",

          fx_rate:
            "58",

          executor_fee:
            "10",

          executor_fee_currency:
            "PHP",

          unibridge_fee:
            "1",

          unibridge_fee_currency:
            "USDC",

          partner_fee:
            "0.5",

          partner_fee_currency:
            "USDC"
        },

        customerPaymentAmount:
          "100",

        customerPaymentCurrency:
          "USDC",

        sourceLabel:
          "Wallet"
      },

      indicative: {
        route: {
          label:
            "Brazil PIX",

          payout_amount:
            "531.42",

          recipient_currency:
            "BRL",

          recipient_amount_type:
            "indicative",

          funding_amount:
            "100",

          settlement_currency:
            "USDC",

          fx_rate:
            "5.3142"
        },

        customerPaymentAmount:
          "100",

        customerPaymentCurrency:
          "USDC",

        sourceLabel:
          "Card"
      },

      unavailable: {
        route: {
          label:
            "Bank transfer",

          recipient_currency:
            "BRL",

          recipient_amount_type:
            "unavailable",

          funding_amount:
            "100",

          settlement_currency:
            "USDC"
        },

        customerPaymentAmount:
          "100",

        customerPaymentCurrency:
          "USD",

        sourceLabel:
          "Bank transfer"
      },

      "empty-fees": {
        route: {
          label:
            "Brazil PIX",

          recipient_currency:
            "BRL",

          settlement_currency:
            "USDC",

          payout_amount:
            "540",

          funding_amount:
            "100",

          recipient_amount_type:
            "final",

          executor_fee:
            "50",

          unibridge_fee:
            "25",

          partner_fee:
            "10",

          pricing_result: {
            quote: {
              settlement: {
                amount:
                  "100",

                currency:
                  "USDC"
              },

              recipient: {
                amount:
                  "540",

                currency:
                  "BRL",

                type:
                  "final"
              },

              fees: []
            }
          }
        },

        customerPaymentAmount:
          "100",

        customerPaymentCurrency:
          "USDC",

        sourceLabel:
          "USDC on Polygon"
      }
    };

    function showScenario(
      scenarioName
    ) {
      const scenario =
        scenarios[scenarioName];

      const viewModel =
        createPricingViewModel(
          scenario
        );

      renderPricing(
        container,
        viewModel
      );

      output.textContent =
        JSON.stringify(
          viewModel,
          null,
          2
        );
    }

    document.addEventListener(
      "click",
      event => {
        const button =
          event.target.closest(
            "[data-test]"
          );

        if (!button) {
          return;
        }

        const scenarioName =
          button.dataset.test;

        if (
          scenarioName === "clear"
        ) {
          clearPricing(
            container
          );

          output.textContent =
            "Pricing cleared.";

          return;
        }

        showScenario(
          scenarioName
        );
      }
    );

    showScenario(
      "canonical"
    );
  </script>
</body>
</html>
