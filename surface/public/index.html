<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>UniBridge</title>

<style>

body{
font-family:system-ui,-apple-system,Segoe UI,Roboto;
background:#f8fafc;
margin:0;
padding:40px 20px;
display:flex;
justify-content:center;
}

.container{
max-width:420px;
width:100%;
}

.logo{
font-weight:700;
font-size:20px;
margin-bottom:20px;
color:#003366;
}

.steps{
display:flex;
justify-content:space-between;
margin-bottom:20px;
font-size:12px;
color:#9aa4af;
}

.step{
flex:1;
text-align:center;
}

.step.active{
color:#00D4AA;
font-weight:600;
}

.card{
border:1px solid #e5edf3;
border-radius:14px;
padding:24px;
background:#ffffff;
}

.summary{
background:#f1f5f9;
border-radius:10px;
padding:12px;
margin-bottom:15px;
font-size:14px;
display:none;
}

.summary div{
margin:6px 0;
}

h2{
margin-top:0;
margin-bottom:20px;
font-size:22px;
color:#003366;
}

h3{
margin-top:18px;
margin-bottom:8px;
font-size:16px;
color:#003366;
}

input,select,button{
width:100%;
padding:14px;
margin-top:10px;
font-size:16px;
border-radius:10px;
box-sizing:border-box;
}

input,select{
border:1px solid #e5edf3;
}

button{
background:#00D4AA;
color:#003366;
border:none;
cursor:pointer;
font-weight:600;
}

button:disabled{
opacity:.5;
cursor:not-allowed;
}

#pixBox{
display:none;
margin-top:10px;
}

#taxBox{
display:none;
}

#status{
margin-top:18px;
font-size:14px;
color:#6b7280;
}

.status-success{
color:#00b894;
font-weight:600;
}

.status-error{
color:#c62828;
font-weight:600;
}

.muted{
font-size:12px;
color:#6b7280;
margin-top:8px;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">UniBridge</div>

<div class="steps">
<div id="step1" class="step active">Setup</div>
<div id="step2" class="step">Route</div>
<div id="step3" class="step">Payment</div>
<div id="step4" class="step">Processing</div>
<div id="step5" class="step">Done</div>
</div>

<div class="card">

<h2>Send money</h2>

<div id="summary" class="summary">
<div><strong>You pay</strong>: <span id="sumFunding"></span></div>
<div><strong>Recipient country</strong>: <span id="sumCountry"></span></div>
<div><strong>Route</strong>: <span id="sumRoute">PIX Instant</span></div>
</div>

<input id="amount" type="number" step="0.01" value="10"/>

<select id="source_country">
<option value="US">United States</option>
<option value="EU">Europe</option>
</select>

<select id="country">
<option value="BR">Brazil</option>
</select>

<button id="sendBtn">Get quote</button>

<div id="pixBox">

<h3>PIX key</h3>

<input id="pix"/>

<div id="taxBox">
<input id="taxId" placeholder="CPF / CNPJ"/>
</div>

<button id="continueBtn">Continue to payment</button>

</div>

<div id="status"></div>

</div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

const tg = window.Telegram?.WebApp
if(tg){ tg.expand() }

let sessionId=null
let routeId=null
let settlementId=null
let poller=null

const sendBtn=document.getElementById("sendBtn")
const continueBtn=document.getElementById("continueBtn")
const statusBox=document.getElementById("status")
const pixBox=document.getElementById("pixBox")

function setStatus(msg){
statusBox.innerText=msg
}

async function api(endpoint,payload){

const r = await fetch(
"/surface/api/proxy?endpoint=" + encodeURIComponent(endpoint),
{
method:"POST",
headers:{ "content-type":"application/json" },
body:JSON.stringify(payload || {})
}
)

const text = await r.text()

let data

try{
data = JSON.parse(text)
}catch{
data = { raw:text }
}

if(!r.ok){
throw new Error(data.error || "api_error")
}

return data
}

async function startFlow(){

try{

setStatus("Registering...")

const reg = await api("session/register",{
source_country:"US",
receiver_country:"BR"
})

sessionId = reg.session_id

await api("session/resolve",{session_id:sessionId})

const quote = await api("session/quote",{
session_id:sessionId,
amount:10
})

routeId = quote.routes[0].route_id

pixBox.style.display="block"

setStatus("Enter PIX")

}
catch(e){
console.error(e)
setStatus(e.message)
}

}

async function continueFlow(){

try{

setStatus("Creating...")

const create = await api("settlement/create",{
session_id:sessionId,
route_id:routeId,
destination:{pix:"51999999999"}
})

settlementId = create.settlement_id

const funding = await api("funding/session",{settlement_id:settlementId})

window.location.href = funding.widget_url

}
catch(e){
console.error(e)
setStatus(e.message)
}

}

sendBtn.onclick = startFlow
continueBtn.onclick = continueFlow

</script>

</body>
</html>
