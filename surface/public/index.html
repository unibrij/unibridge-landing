<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UniBridge</title>

  <style>
    body{
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:#f8fafc;
      margin:0;
      padding:40px 20px;
      display:flex;
      justify-content:center;
    }

    .container{
      max-width:420px;
      width:100%;
    }

    .logo{
      font-weight:700;
      font-size:20px;
      margin-bottom:20px;
      color:#003366;
    }

    .steps{
      display:grid;
      grid-template-columns:repeat(6,1fr);
      gap:6px;
      margin-bottom:20px;
      font-size:12px;
      color:#9aa4af;
    }

    .step{
      text-align:center;
    }

    .step.active{
      color:#00D4AA;
      font-weight:600;
    }

    .card{
      border:1px solid #e5edf3;
      border-radius:14px;
      padding:24px;
      background:#ffffff;
    }

    .summary{
      background:#f1f5f9;
      border-radius:10px;
      padding:12px;
      margin-bottom:15px;
      font-size:14px;
      display:none;
    }

    .summary div{
      margin:6px 0;
    }

    h2{
      margin:0 0 20px;
      font-size:22px;
      color:#003366;
    }

    h3{
      margin:18px 0 8px;
      font-size:16px;
      color:#003366;
    }

    input,select,button{
      width:100%;
      padding:14px;
      margin-top:10px;
      font-size:16px;
      border-radius:10px;
      box-sizing:border-box;
    }

    input,select{
      border:1px solid #e5edf3;
      background:#fff;
    }

    button{
      background:#00D4AA;
      color:#003366;
      border:none;
      cursor:pointer;
      font-weight:600;
    }

    button:disabled{
      opacity:.5;
      cursor:not-allowed;
    }

    #pixBox,
    #taxBox,
    #authBox,
    #signBox{
      display:none;
      margin-top:10px;
    }

    #status{
      margin-top:18px;
      font-size:14px;
      color:#6b7280;
      white-space:pre-line;
    }

    .status-success{
      color:#00b894;
      font-weight:600;
    }

    .status-error{
      color:#c62828;
      font-weight:600;
    }

    .muted{
      font-size:12px;
      color:#6b7280;
      margin-top:8px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="logo">UniBridge</div>

    <div class="steps">
      <div id="step1" class="step active">Setup</div>
      <div id="step2" class="step">Route</div>
      <div id="step3" class="step">Payment</div>
      <div id="step4" class="step">Funding</div>
      <div id="step5" class="step">Sign</div>
      <div id="step6" class="step">Done</div>
    </div>

    <div class="card">
      <h2>Send money</h2>

      <div id="summary" class="summary">
        <div><strong>Amount</strong>: <span id="sumAmount"></span></div>
        <div><strong>Country</strong>: <span id="sumCountry"></span></div>
      </div>

      <input id="amount" type="number" step="0.01" value="10" placeholder="Amount">

      <select id="source_country">
        <option value="US">United States</option>
        <option value="EU">Europe</option>
      </select>

      <select id="country">
        <option value="BR">Brazil</option>
      </select>

      <button id="sendBtn" type="button">Get quote</button>

      <div id="pixBox">
        <h3>PIX key</h3>
        <input id="pix" placeholder="Enter PIX key">

        <div id="taxBox">
          <input id="taxId" placeholder="CPF / CNPJ">
        </div>

        <button id="continueBtn" type="button" disabled>Continue to payment</button>

        <div class="muted">
          PIX key is required.
        </div>
      </div>

      <div id="authBox">
        <h3 id="authTitle">Authentication</h3>

        <input id="authEmail" type="email" placeholder="Enter email">
        <input id="authOtp" type="text" placeholder="Enter OTP" style="display:none;">

        <button id="authBtn" type="button" style="display:none;">Continue</button>

        <div class="muted" id="authHint">
          Complete the required authentication step.
        </div>
      </div>

      <div id="signBox">
        <h3>Sign transfer</h3>

        <div class="muted">
          Funding confirmed. Sign to complete transfer.
        </div>

        <button id="signBtn" type="button" disabled>Sign &amp; Send</button>
      </div>

      <div id="status"></div>
    </div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/surface/js/api.js"></script>
  <script src="/surface/js/status.js"></script>
  <script src="/surface/js/nextAction.js"></script>
  <script src="/surface/js/rampFlow.js"></script>
  <script src="/surface/app.js"></script>

  <script>
    function setStep(n) {
      for (let i = 1; i <= 6; i++) {
        document.getElementById("step" + i)?.classList.remove("active");
      }
      document.getElementById("step" + n)?.classList.add("active");
    }

    const summaryBox = document.getElementById("summary");
    const pixBox = document.getElementById("pixBox");
    const signBox = document.getElementById("signBox");
    const taxBox = document.getElementById("taxBox");
    const authBox = document.getElementById("authBox");

    function showSummary() {
      summaryBox.style.display = "block";
    }

    function hideSummary() {
      summaryBox.style.display = "none";
    }

    function showPixBox() {
      pixBox.style.display = "block";
    }

    function hidePixBox() {
      pixBox.style.display = "none";
    }

    function showSignBox() {
      signBox.style.display = "block";
    }

    function hideSignBox() {
      signBox.style.display = "none";
    }

    function showTaxBox() {
      taxBox.style.display = "block";
    }

    function hideTaxBox() {
      taxBox.style.display = "none";
    }

    function hideAuthBox() {
      authBox.style.display = "none";
    }

    function resetUiToStart() {
      hideSummary();
      hidePixBox();
      hideSignBox();
      hideTaxBox();
      hideAuthBox();
      setStep(1);
    }

    window.addEventListener("unibridge:quote", () => {
      showSummary();
      showPixBox();
      hideSignBox();
      hideTaxBox();
      hideAuthBox();
      setStep(2);
    });

    window.addEventListener("unibridge:payment", () => {
      showSummary();
      showPixBox();
      hideSignBox();
      hideTaxBox();
      hideAuthBox();
      setStep(3);
    });

    window.addEventListener("unibridge:funding", () => {
      showSummary();
      hidePixBox();
      hideSignBox();
      hideTaxBox();
      hideAuthBox();
      setStep(4);
    });

    window.addEventListener("unibridge:ready", () => {
      showSummary();
      hidePixBox();
      showSignBox();
      hideTaxBox();
      hideAuthBox();
      setStep(5);
    });

    window.addEventListener("unibridge:done", () => {
      showSummary();
      hidePixBox();
      hideSignBox();
      hideTaxBox();
      hideAuthBox();
      setStep(6);
    });

    resetUiToStart();
  </script>
</body>
</html>
