<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>
    UniBridge — Stripe Link Sandbox Test
  </title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 16px;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f7f7f8;
      color: #111827;
    }

    main {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 24px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    h2 {
      margin: 28px 0 8px;
      font-size: 17px;
    }

    p {
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font: inherit;
    }

    button {
      width: 100%;
      min-height: 44px;
      margin-top: 12px;
      padding: 10px 14px;
      border: 0;
      border-radius: 10px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    #status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      background: #f3f4f6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #auth-container {
      margin-top: 20px;
    }

    code {
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <main>
    <h1>
      Stripe Embedded Components — Sandbox
    </h1>

    <p>
      Temporary Link, CryptoCustomer, KYC, ACH, and headless session test.
    </p>

    <label for="email">
      Email
    </label>

    <input
      id="email"
      type="email"
      value="wael.alderani@gmail.com"
      autocomplete="email"
    />

    <label for="phone">
      Sandbox test phone
    </label>

    <input
      id="phone"
      type="tel"
      placeholder="+18004444444"
      autocomplete="tel"
    />

    <label for="full-name">
      Sandbox test full name
    </label>

    <input
      id="full-name"
      type="text"
      value="John Smith"
      autocomplete="name"
    />

    <button
      id="register-button"
      type="button"
      disabled
    >
      1. Register Link user
    </button>

    <button
      id="auth-intent-button"
      type="button"
      disabled
    >
      2. Create LinkAuthIntent
    </button>

    <button
      id="authenticate-button"
      type="button"
      disabled
    >
      3. Authenticate
    </button>

    <button
      id="customer-context-button"
      type="button"
      disabled
    >
      4. Load CryptoCustomer
    </button>

    <h2>
      Stripe KYC
    </h2>

    <label for="kyc-first-name">
      First name
    </label>

    <input
      id="kyc-first-name"
      type="text"
      value="John"
      autocomplete="given-name"
    />

    <label for="kyc-last-name">
      Last name
    </label>

    <input
      id="kyc-last-name"
      type="text"
      value="Smith"
      autocomplete="family-name"
    />

    <label for="kyc-id-number">
      ID number
    </label>

    <input
      id="kyc-id-number"
      type="text"
      value="000000000"
      autocomplete="off"
    />

    <label for="kyc-dob">
      Date of birth
    </label>

    <input
      id="kyc-dob"
      type="date"
      value="1990-01-01"
      autocomplete="bday"
    />

    <label for="kyc-address-line1">
      Address
    </label>

    <input
      id="kyc-address-line1"
      type="text"
      value="123 Main St"
      autocomplete="address-line1"
    />

    <label for="kyc-city">
      City
    </label>

    <input
      id="kyc-city"
      type="text"
      value="San Francisco"
      autocomplete="address-level2"
    />

    <label for="kyc-state">
      State
    </label>

    <input
      id="kyc-state"
      type="text"
      value="CA"
      autocomplete="address-level1"
    />

    <label for="kyc-postal-code">
      Postal code
    </label>

    <input
      id="kyc-postal-code"
      type="text"
      value="94111"
      autocomplete="postal-code"
    />

    <button
      id="kyc-button"
      type="button"
      disabled
    >
      5. Submit KYC
    </button>

    <h2>
      ACH Payment Method
    </h2>

    <button
      id="ach-button"
      type="button"
      disabled
    >
      6. Collect ACH Payment Method
    </button>

    <h2>
      ACH Headless Session
    </h2>

    <label for="session-amount">
      Source amount
    </label>

    <input
      id="session-amount"
      type="number"
      min="0.01"
      step="0.01"
      value="100"
      inputmode="decimal"
    />

    <label for="session-currency">
      Source currency
    </label>

    <input
      id="session-currency"
      type="text"
      value="usd"
      autocomplete="off"
    />

    <label for="wallet-address">
      Polygon wallet address
    </label>

    <input
      id="wallet-address"
      type="text"
      placeholder="0x..."
      autocomplete="off"
    />

    <button
      id="headless-session-button"
      type="button"
      disabled
    >
      7. Create ACH Headless Session
    </button>

    <h2>
      Generic Headless Quote
    </h2>

    <label for="quote-amount">
      Source amount
    </label>

    <input
      id="quote-amount"
      type="number"
      min="0.01"
      step="0.01"
      value="100"
      inputmode="decimal"
    />

    <label for="quote-currency">
      Source currency
    </label>

    <input
      id="quote-currency"
      type="text"
      value="usd"
      autocomplete="off"
    />

    <button
      id="quote-button"
      type="button"
      disabled
    >
      8. Get Generic Headless Quote
    </button>

    <div id="status">
      Loading Stripe Crypto SDK...
    </div>

    <div id="auth-container"></div>
  </main>

  <script
    type="module"
    src="/surface/js/stripe-link-test.js?v=20260911-headless-session"
  ></script>
</body>

</html>
