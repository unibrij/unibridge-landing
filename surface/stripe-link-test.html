<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />

  <meta

  <title>
    UniBridge — Stripe Link Sandbox Test

  <style>
    * {

    }

    body {
      margin: 0;
      padding: 32px 16px;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f7f7f8;
      color: #111827;
    }

    main {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 24px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    h2 {
      margin: 28px 0 8px;
      font-size: 17px;
    }

    p {
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font: inherit;
    }

    button {
      width: 100%;
      min-height: 44px;
      margin-top: 12px;
      padding: 10px 14px;
      border: 0;
      border-radius: 10px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    #status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      background: #f3f4f6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #auth-container {
      margin-top: 20px;
    }

    code {
      overflow-wrap: anywhere;
    }
  </style>

  <!--
  --------------------------------------------------
  Clerk

  Same public Clerk application used by UniBridge.

  The Stripe diagnostic script is intentionally loaded
  only after Clerk has initialized and a signed-in
  session is available.

  No Clerk token is written to the DOM or console.
  --------------------------------------------------
  -->

  <script
    defer
    crossorigin="anonymous"
    src="https://clerk.unibrij.io/npm/@clerk/ui@1/dist/ui.browser.js"
    type="text/javascript"
  ></script>

  <script
    defer
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_live_Y2xlcmsudW5pYnJpai5pbyQ"
    src="https://clerk.unibrij.io/npm/@clerk/clerk-js@6/dist/clerk.browser.js"
    type="text/javascript"
  ></script>
</head>

<body>
  <main>
    <h1>

    <label for="email">

    <input
      id="email"

    />

    <label for="phone">

    </label>

    <input
      id="phone"
      type="tel"

    />

    <label for="full-name">

    </label>

    <input

      value="John Smith"

    />

    <button

    >

    </button>

    <button

    >

    </button>

    <button

    </button>

    <button

    <h2>

    <label for="kyc-first-name">

    <label for="kyc-city">

    <label for="kyc-state">

    <button

    <h2>

    <h2>
      ACH Headless Session
    </h2>

    <!--
    --------------------------------------------------
    Legacy fields retained for compatibility with the
    diagnostic JS.

    stripe-link-test.js disables them and does not send
    them to settlement-bound backend endpoints.
    --------------------------------------------------
    -->

    <label for="session-amount">

    />

    <label for="session-currency">

    </label>

    <input

      value="usd"
      autocomplete="off"
    />

    <label for="wallet-address">
      Polygon wallet address
    </label>

    <input
      id="wallet-address"
      type="text"
      placeholder="0x..."
      autocomplete="off"
    />

    <button
      id="transaction-limits-button"
      type="button"
      disabled
    >
      8. Get ACH Transaction Limits
    </button>

    <button
      id="headless-session-button"
      type="button"
      disabled
    >
      10. Create ACH Headless Session + Quote
    </button>

    <h2>
      Legacy Quote Inputs
    </h2>

    <label for="quote-amount">
      Source amount
    </label>

    <input
      id="quote-amount"
      type="number"
      min="0.01"
      step="0.01"
      value="100"
      inputmode="decimal"
    />

    <label for="quote-currency">
      Source currency
    </label>

    <input
      id="quote-currency"
      type="text"
      value="usd"
      autocomplete="off"
    />

    <button
      id="quote-button"
      type="button"
      disabled
    >
      11. Perform Checkout
    </button>

    <div id="status">
      Loading Clerk authentication...
    </div>

    <div id="auth-container"></div>
  </main>

  <script>
    (() => {
      const STRIPE_TEST_SCRIPT =
        "/surface/js/stripe-link-test.js?v=20260917-l2-clerk";

      function setBootstrapStatus(
        message,
        payload = null
      ) {
        const status =
          document.getElementById(
            "status"
          );

        if (!status) {
          return;
        }

        let text =
          String(
            message || ""
          );

        if (
          payload !==
          null
        ) {
          try {
            text +=
              "\n\n" +
              JSON.stringify(
                payload,
                null,
                2
              );
          } catch {
            text +=
              "\n\n" +
              String(
                payload
              );
          }
        }

        status.textContent =
          text;
      }


      function loadStripeDiagnosticScript() {
        return new Promise(
          (
            resolve,
            reject
          ) => {
            const script =
              document.createElement(
                "script"
              );

            script.type =
              "module";

            script.src =
              STRIPE_TEST_SCRIPT;

            script.onload =
              () =>
                resolve();

            script.onerror =
              () =>
                reject(
                  new Error(
                    "stripe_diagnostic_script_load_failed"
                  )
                );

            document.body
              .appendChild(
                script
              );
          }
        );
      }


      window.addEventListener(
        "load",
        async () => {
          try {
            if (
              !window.Clerk
            ) {
              throw new Error(
                "clerk_not_available_after_script_load"
              );
            }

            setBootstrapStatus(
              "Initializing Clerk..."
            );

            await window.Clerk.load({
              ui: {
                ClerkUI:
                  window.__internal_ClerkUICtor
              }
            });

            if (
              !window.Clerk.session
            ) {
              throw new Error(
                "clerk_session_not_available"
              );
            }

            if (
              typeof window.Clerk
                .session
                .getToken !==
                "function"
            ) {
              throw new Error(
                "clerk_get_token_not_available"
              );
            }

            /*
            --------------------------------------------------
            Prove a bearer token can actually be obtained
            before loading the Stripe diagnostic.

            Never display or log the token.
            --------------------------------------------------
            */

            const token =
              await window.Clerk
                .session
                .getToken();

            if (
              !String(
                token ?? ""
              ).trim()
            ) {
              throw new Error(
                "missing_clerk_bearer_token"
              );
            }

            setBootstrapStatus(
              "Clerk authenticated. Loading Stripe diagnostic...",
              {
                signedIn:
                  true,

                tokenReady:
                  true
              }
            );

            await loadStripeDiagnosticScript();
          } catch (
            error
          ) {
            console.error(
              "STRIPE_DIAGNOSTIC_BOOTSTRAP_FAILED",
              {
                message:
                  error?.message ??
                  String(
                    error
                  )
              }
            );

            setBootstrapStatus(
              "Stripe diagnostic authentication bootstrap failed.",
              {
                message:
                  error?.message ??
                  String(
                    error
                  )
              }
            );
          }
        }
      );
    })();
  </script>
</body>

</html>
